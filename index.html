<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Restoran Zeta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #2b1d16, #5c3a21);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .login-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #777;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #d35400;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #d35400;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background-color: #b34700;
        }
        .footer-links {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
        .footer-links a {
            color: #d35400;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🍽️ Restoran Zeta</div>
        <div class="subtitle">Silakan masuk untuk memesan hidangan favorit Anda</div>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="email">Email atau Username</label>
                <input type="text" id="email" name="email" placeholder="Masukkan email Anda" required>
            </div>
            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" required>
            </div>
            <button type="submit" class="btn-login">Masuk</button>
        </form>
        <div class="footer-links">
            Belum punya akun? <a href="#">Daftar Sekarang</a>
        </div>
    </div>
</body>
</html>
